<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Matriz de habilidades QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: una columna de 560px; barra de sesión fija arriba; tarjetas por sección; el estado se lee por franjas de color */
  --bg:#E8EBEE; --surface:#FFFFFF; --ink:#1C2025; --muted:#58616A; --line:#D2D7DC;
  --accent:#6B1D38; --accent-ink:#FFFFFF; --accent-soft:#F2E3E9;
  --ok:#1D7843; --ok-bg:#E1F0E7; --warn:#8C5800; --warn-bg:#FAECD0; --bad:#B42318; --bad-bg:#FBE2DF; --na:#58616A; --na-bg:#E8EBEE;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121519; --surface:#1B1F24; --ink:#E8EBEE; --muted:#9AA3AD; --line:#2D333A;
    --accent:#E58FAD; --accent-ink:#24101A; --accent-soft:#3A1E2A;
    --ok:#62CB8E; --ok-bg:#15301F; --warn:#F0B54A; --warn-bg:#33270F; --bad:#FF8476; --bad-bg:#3B1B18; --na:#9AA3AD; --na-bg:#23282E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121519; --surface:#1B1F24; --ink:#E8EBEE; --muted:#9AA3AD; --line:#2D333A;
  --accent:#E58FAD; --accent-ink:#24101A; --accent-soft:#3A1E2A;
  --ok:#62CB8E; --ok-bg:#15301F; --warn:#F0B54A; --warn-bg:#33270F; --bad:#FF8476; --bad-bg:#3B1B18; --na:#9AA3AD; --na-bg:#23282E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
body.oculto #app{filter:blur(18px)}
@media print{ body *{display:none !important} body::after{content:"La impresión está deshabilitada en esta herramienta.";display:block;padding:40px;font:16px sans-serif} }

header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font:700 21px/1 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.tag{font:500 10px/1 var(--font-mono);padding:4px 6px;border:1px solid var(--accent);color:var(--accent);border-radius:4px;letter-spacing:.08em}
.session{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.25;text-align:right}
.session b{display:block;font-weight:600}
.session .s-full span{color:var(--muted);display:block}
.ini-s{display:none;width:36px;height:36px;font-size:15px}
@media (max-width:460px){ .session .s-full{display:none} .ini-s{display:grid} .tag-u{display:none} .brand{font-size:19px} }
nav.tabs{max-width:560px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{font:600 14px/1 var(--font-body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 8px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main.wrap{max-width:560px;margin:0 auto;padding:20px 16px 56px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:32px;line-height:1.02}
h2{font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:19px;line-height:1.15}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px}
.section{display:grid;gap:10px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums}
.small{font-size:13px;line-height:1.4}

.btn{font:600 15px/1.1 var(--font-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:56px;font-size:17px}
.btn.small{padding:8px 12px;min-height:36px;font-size:14px}
.btn.link{justify-self:start;border:0;background:none;color:var(--accent);padding:8px 0;min-height:auto;text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,input:focus-visible,label.btn:focus-within,nav.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.btn input{position:absolute;opacity:0;width:1px;height:1px}

.acct{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.acct:hover{border-color:var(--accent)}
.acct:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ini{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 18px/1 var(--font-display)}
.acct b{display:block}
.acct .small{color:var(--muted)}
.lvl{font:500 11px/1 var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:4px 6px}

.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--font-body);padding:6px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.k-ok{color:var(--ok);background:var(--ok-bg)}
.k-warn{color:var(--warn);background:var(--warn-bg)}
.k-bad{color:var(--bad);background:var(--bad-bg)}
.k-na{color:var(--na);background:var(--na-bg)}

.msg{border-radius:8px;padding:10px 12px;font-size:14px}
.msg:empty{display:none}

form.inline{display:flex;gap:8px}
form.inline input{flex:1;min-width:0;font:500 16px/1 var(--font-mono);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px;text-transform:uppercase}
.tests{display:flex;flex-wrap:wrap;gap:8px}
.tests button{font:500 13px/1.2 var(--font-body);text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer}
.tests button .mono{display:block;font-size:12px;color:var(--muted)}

.protegido{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.wm{position:absolute;inset:0;pointer-events:none;background-repeat:repeat;opacity:.12;z-index:3;border-radius:inherit}

.who{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.foto{width:72px;height:88px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 28px/1 var(--font-display);position:relative}
.foto::after{content:"foto";position:absolute;bottom:4px;font:500 9px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.who h1{font-size:27px}
.who .meta{color:var(--muted);font-size:14px;line-height:1.35;margin-top:4px}

.verdict{border-radius:var(--radius);padding:14px 16px;border-left:8px solid currentColor;display:grid;gap:4px}
.verdict h2{color:inherit;font-size:24px;text-transform:none;letter-spacing:.01em}
.verdict p{color:var(--ink);font-size:15px}

.rows{display:grid}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0;padding-top:2px}
.row .t{font-weight:600}
.row .d{grid-column:1 / -1;font-size:13px;color:var(--muted)}
.row .acts{grid-column:1 / -1;display:flex;justify-content:flex-end}
.row.bad .t{color:var(--bad)}

.btns{display:flex;flex-wrap:wrap;gap:8px}
[data-act="reset"]{justify-self:start}
select{font:500 14px/1.2 var(--font-body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:40px;max-width:170px}
select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row .t .sub{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.locked{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.locked svg{width:24px;height:24px}

.foot{font-size:12px;color:var(--muted);line-height:1.45}

.modal{position:fixed;inset:0;background:rgba(8,10,12,.62);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px 24px;display:grid;gap:12px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.docpage{background:#fff;color:#1C2025;border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:14px;min-height:420px;align-content:start}
.doc-band{font:700 15px/1 "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid #1C2025;padding-bottom:8px}
.docpage dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.docpage dt{color:#58616A}
.docpage dd{margin:0;font-weight:500}
.doc-scan{border:1px dashed #9AA3AD;border-radius:6px;min-height:170px;display:grid;place-items:center;text-align:center;padding:16px;color:#58616A;font-size:13px;background:repeating-linear-gradient(135deg,#F4F5F7 0 10px,#FFFFFF 10px 20px)}

.log-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.stat b{display:block;font:700 30px/1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.log-row{display:grid;grid-template-columns:56px 1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:start}
.log-row:first-child{border-top:0}
.log-row .h{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:2px}
.log-row .w{font-size:12px;color:var(--muted)}

.creds{display:grid;gap:18px}
.cred-pair{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.cred{width:100%;max-width:340px;aspect-ratio:85.6/54;background:#fff;color:#1C2025;border-radius:12px;border:1px solid #C9CED4;display:grid;grid-template-columns:1fr 36%;overflow:hidden;font-family:var(--font-body)}
.cred-l{display:grid;grid-template-rows:auto 1fr;min-width:0}
.cred-band{background:#6B1D38;color:#fff;font:700 11px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px}
.cred-body{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:9px 10px;align-content:start}
.cred-foto{width:44px;height:54px;border-radius:4px;background:#F2E3E9;color:#6B1D38;display:grid;place-items:center;font:700 18px/1 "Barlow Condensed",sans-serif}
.cred-n{font:700 15px/1.05 "Barlow Condensed","Arial Narrow",sans-serif}
.cred-id{font:500 10px/1.2 "IBM Plex Mono",monospace;margin-top:3px}
.cred-p{font-size:9.5px;line-height:1.25;color:#58616A;margin-top:3px}
.cred-note{grid-column:1 / -1;font-size:8.5px;line-height:1.25;color:#58616A;border-top:1px solid #E1E4E8;padding-top:5px}
.cred-r{display:grid;place-items:center;align-content:center;gap:2px;padding:8px 8px 8px 0}
.cred-r svg,.sticker svg{width:100%;height:auto;display:block}
.cred-r .mono{font-size:9px}
.sticker{width:132px;background:#fff;color:#1C2025;border:2px solid #1C2025;border-radius:10px;padding:8px;text-align:center;display:grid;gap:4px}
.sticker .mono{font-size:12px}
.sticker .s{font:700 11px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.06em}

.sec-item{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.sec-item:first-child{border-top:0;padding-top:0}
.sec-item h3{font-size:18px}
.sec-item p{font-size:15px;color:var(--muted)}
.sec-item.real{border-left:4px solid var(--accent);padding-left:12px}

@media (prefers-reduced-motion: no-preference){ .fade{animation:fade .18s ease-out} @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>
</head>

const PREFIX = D.prefix;
const DAY = 864e5;
const T0 = (()=>{ const t = new Date(); t.setHours(0,0,0,0); return t; })();
const dt = off => new Date(T0.getTime() + off * DAY);
const fDate = d => d.toLocaleDateString('es-MX', {day:'numeric', month:'short', year:'numeric'}).replace(/\./g, '');
const fTime = d => d.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit', hour12:false});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iniciales = n => { const p = n.split(' ').filter(Boolean); return (p[0][0] + (p.length >= 3 ? p[p.length - 2][0] : p[p.length - 1][0])).toUpperCase(); };
const workerById = id => D.workers.find(w => w.id === id);

const NIVELES = [
  {n:0, t:'Sin acceso', ve:'No ve nada; puede solicitar acceso a RH'},
  {n:1, t:'Supervisor', ve:'Ve equipos autorizados y vigencias'},
  {n:2, t:'EHS / Capacitación', ve:'Ve todo: documentos, registro y credenciales'},
  {n:3, t:'Administrador', ve:'Ve todo y decide quién tiene acceso'}
];
const NIVEL_INICIAL = {sup:1, ehs:2, rh:3, rob:0, none:0};
const USERS = [
  {id:'sup',  nombre:'Carlos Ibarra',   rol:'Supervisor de turno'},
  {id:'ehs',  nombre:'Paola Medina',    rol:'EHS / Capacitación'},
  {id:'rh',   nombre:'Laura Quiroga',   rol:'Recursos Humanos'},
  {id:'rob',  nombre:'Roberto Salinas', rol:'Jefe de mantenimiento'},
  {id:'none', nombre:'Javier Lozano',   rol:'Operador'}
];
USERS.forEach(u => u.nivel = NIVEL_INICIAL[u.id]);
const userById = id => USERS.find(u => u.id === id);

const S = { user:null, view:'login', wid:null, msg:null, doc:null, aviso:null, log:[], last:Date.now(), solicitudes:[], pendiente:null };
function guardar(){ try { localStorage.setItem('mhqr', JSON.stringify({niveles:USERS.map(u => [u.id, u.nivel]), sol:S.solicitudes.map(x => ({u:x.u.id, t:+x.t, wid:x.wid}))})); } catch (e) {} }
(function cargar(){ try { const d = JSON.parse(localStorage.getItem('mhqr') || 'null'); if (!d) return; d.niveles.forEach(([id, n]) => { const u = userById(id); if (u && n >= 0 && n <= 3) u.nivel = n; }); S.solicitudes = d.sol.map(x => ({u:userById(x.u), t:new Date(x.t), wid:x.wid})).filter(x => x.u); } catch (e) {} })();
(function seed(){

  S.log.push({t:at(-1, 6, 12),  u:userById('sup'), acc:'Consultó perfil (foto del QR)', wid:'MH-0187', ok:true});

})();
function registrar(acc, wid, ok){ S.log.push({t:new Date(), u:S.user, acc, wid, ok}); }

function estado(off){
  if (off === null || off === undefined) return {k:'na', t:'No aplica'};
  if (off < 0) return {k:'bad', t:`Vencido hace ${-off} ${-off === 1 ? 'día' : 'días'}`};
  if (off === 0) return {k:'warn', t:'Vence hoy'};
  if (off <= 30) return {k:'warn', t:`Vence en ${off} ${off === 1 ? 'día' : 'días'}`};
  return {k:'ok', t:'Vigente'};
}

function evaluar(w){
  const licVencida = !!(w.licencia && w.licencia.vence < 0);
  const eqs = w.equipos.map(e => {
    let s = estado(e.vence), motivo;
    if (licVencida) { s = {k:'bad', t:'No autorizado'}; motivo = `Licencia interna vencida el ${fDate(dt(w.licencia.vence))}`; }
    else if (s.k === 'bad') { s = {k:'bad', t:'No autorizado'}; motivo = `Autorización vencida el ${fDate(dt(e.vence))}`; }
    else if (s.k === 'warn') { motivo = `Vence el ${fDate(dt(e.vence))}. Programar reevaluación.`; }
    else { motivo = `Vigente hasta el ${fDate(dt(e.vence))}`; }
    return {...e, s, motivo};
  });
  const permit = eqs.filter(e => e.s.k !== 'bad');
  const no = eqs.filter(e => e.s.k === 'bad');
  const pronto = eqs.filter(e => e.s.k === 'warn').length;
  let v;
  if (!eqs.length) v = {k:'na', titulo:'Sin equipos autorizados', sub: w.entrenamiento ? 'Está en entrenamiento. No puede operar equipo sin supervisión.' : 'No tiene equipos asignados.'};
  else if (!permit.length) v = {k:'bad', titulo:'No autorizado para operar', sub: licVencida ? 'Su licencia interna está vencida. No debe operar ningún equipo hasta renovarla.' : 'Todas sus autorizaciones están vencidas.'};
  else if (no.length) v = {k:'warn', titulo:`Autorizado para ${permit.length} de ${eqs.length} equipos`, sub:`No puede operar: ${no.map(e => e.eq).join(', ')}.`};
  else v = {k:'ok', titulo: eqs.length === 1 ? 'Autorizado para operar su equipo' : `Autorizado para operar sus ${eqs.length} equipos`, sub: pronto ? (pronto === 1 ? 'Una autorización vence en menos de 30 días.' : `${pronto} autorizaciones vencen en menos de 30 días.`) : 'Todas sus autorizaciones están vigentes.'};
  return {eqs, v};
}

function documentos(w){
  const out = [];
  if (w.licencia) out.push({tipo:'Licencia interna', titulo:w.licencia.num, det:`Emitida el ${fDate(dt(w.licencia.emitida))} · vence el ${fDate(dt(w.licencia.vence))}`, vence:w.licencia.vence});
  w.dc3.forEach(c => out.push({tipo:'DC-3', titulo:c.curso, det:`${c.horas} h · emitida el ${fDate(dt(c.emitida))} · reentrenamiento antes del ${fDate(dt(c.vence))}`, vence:c.vence}));
  if (w.ept) out.push({tipo:'EPT', titulo:'EPT', det:`Emitido el ${fDate(dt(w.ept.emitido))} · vence el ${fDate(dt(w.ept.vence))}`, vence:w.ept.vence});
  return out;
}

function normalizar(raw){
  const s = String(raw || '').trim().toUpperCase();
  const h = s.match(/#(MH-\d{4})$/); if (h) return h[1];
  if (s.startsWith(PREFIX)) return s.slice(PREFIX.length);
  if (/^MH-\d{4}$/.test(s)) return s;
  if (/^\d{4}$/.test(s)) return 'MH-' + s;
  return null;
}

function consultar(raw, origen){
  const code = normalizar(raw);
  if (!code) { S.msg = {k:'bad', t:'Ese QR no es de la matriz de habilidades. Debe contener MATRIZ-HAB seguido del código del trabajador.'}; render(); return; }
  const w = workerById(code);
  if (!w) { S.msg = {k:'bad', t:`No hay ningún trabajador con el código ${code}.`}; render(); return; }
  S.msg = null;
  if (S.user.nivel < 1) { registrar('Intentó consultar perfil', code, false); S.wid = code; S.view = 'denegado'; render(); window.scrollTo(0, 0); return; }
  registrar(`Consultó perfil (${origen})`, code, true);
  S.wid = code; S.view = 'perfil'; render(); window.scrollTo(0, 0);
}

async function cargarImagen(file){
  try { return await createImageBitmap(file); }
  catch (e) {
    return await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
  }
}
async function decodificar(file){
  const img = await cargarImagen(file);
  const w0 = img.width || img.naturalWidth, h0 = img.height || img.naturalHeight;
  const intentos = [1400, 900, 2000];
  for (const max of intentos) {
    const sc = Math.min(1, max / Math.max(w0, h0));
    const c = document.createElement('canvas'); c.width = Math.round(w0 * sc); c.height = Math.round(h0 * sc);
    const ctx = c.getContext('2d', {willReadFrequently:true}); ctx.drawImage(img, 0, 0, c.width, c.height);
    if ('BarcodeDetector' in window) {
      try { const det = new BarcodeDetector({formats:['qr_code']}); const r = await det.detect(c); if (r.length) return r[0].rawValue; } catch (e) {}
    }
    if (window.jsQR) {
      const id = ctx.getImageData(0, 0, c.width, c.height);
      const r = jsQR(id.data, c.width, c.height, {inversionAttempts:'attemptBoth'});
      if (r && r.data) return r.data;
    }
  }
  return null;
}

  return `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;

function render(){
  let body;
  if (!S.user) body = S.view === 'seguridad' ? vSeguridad() : vLogin();
  else {
    const NEED = {registro:2, credenciales:2, accesos:3, perfil:1};
    if ((NEED[S.view] || 0) > S.user.nivel) S.view = 'verificar';
    body = ({verificar:vVerificar, perfil:vPerfil, denegado:vDenegado, registro:vRegistro, credenciales:vCredenciales, accesos:vAccesos, seguridad:vSeguridad})[S.view]?.() ?? vVerificar();

function login(id){
  S.user = userById(id); S.view = 'verificar'; S.msg = null; S.aviso = null; S.last = Date.now();
  if (S.pendiente) { const p = S.pendiente; S.pendiente = null; consultar(p, 'QR escaneado con la cámara'); }
  else render();
}
function logout(aviso){ S.user = null; S.view = 'login'; S.wid = null; S.doc = null; S.msg = null; S.aviso = aviso || null; render(); window.scrollTo(0, 0); }
function go(v){
  if (!S.user && v !== 'seguridad') { S.view = 'login'; }
  else S.view = v;

  S.msg = null; render(); window.scrollTo(0, 0);

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'login') login(v);
  else if (a === 'logout') logout();
  else if (a === 'go') go(v);
  else if (a === 'probar') consultar(PREFIX + v, 'prueba');
  else if (a === 'doc') { const w = workerById(S.wid); const d = documentos(w)[+v]; registrar(`Abrió ${d.tipo}: ${d.titulo}`, w.id, true); S.doc = +v; render(); }
  else if (a === 'cerrar-doc') { S.doc = null; render(); }
  else if (a === 'solicitar') { S.solicitudes.push({u:S.user, t:new Date(), wid:S.wid}); S.log.push({t:new Date(), u:S.user, acc:'Solicitó acceso', wid:S.wid, ok:null}); guardar(); render(); }
  else if (a === 'aprobar') { const [i, n] = v.split(':').map(Number); const x = S.solicitudes[i]; if (!x) return; x.u.nivel = n; registrar(`Aprobó el acceso de ${x.u.nombre} como ${NIVELES[n].t}`, x.wid, true); S.solicitudes.splice(i, 1); guardar(); render(); }
  else if (a === 'rechazar') { const x = S.solicitudes[+v]; if (!x) return; registrar(`Rechazó la solicitud de ${x.u.nombre}`, x.wid, true); S.solicitudes.splice(+v, 1); guardar(); render(); }
  else if (a === 'reset') { USERS.forEach(u => u.nivel = NIVEL_INICIAL[u.id]); S.solicitudes = []; try { localStorage.removeItem('mhqr'); } catch (e) {} registrar('Restableció la muestra', '', true); render(); }
});
app.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'f-codigo') consultar(document.getElementById('codigo').value, 'código escrito'); });
app.addEventListener('change', async e => {
  if (e.target.matches && e.target.matches('select[data-user]')) {
    const u = userById(e.target.dataset.user), n = +e.target.value;
    if (u && u.nivel !== n) { u.nivel = n; registrar(`Cambió el acceso de ${u.nombre} a ${NIVELES[n].t}`, '', true); guardar(); render(); }
    return;
  }
  if (e.target.id !== 'foto') return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const box = document.getElementById('scanmsg');
  box.className = 'msg k-na'; box.textContent = 'Leyendo el QR…';
  try {
    const txt = await decodificar(f);
    if (txt) consultar(txt, 'foto del QR');
    else { S.msg = {k:'bad', t:'No encontré un QR en la foto. Acércate para que salga completo, derecho y enfocado.'}; render(); }
  } catch (err) { S.msg = {k:'bad', t:'No pude abrir esa imagen. Prueba con otra foto.'}; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.doc !== null) { S.doc = null; render(); } });
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.protegido')) e.preventDefault(); });
document.addEventListener('copy', e => { const sel = document.getSelection(); if (sel && sel.anchorNode && sel.anchorNode.parentElement && sel.anchorNode.parentElement.closest('.protegido')) e.preventDefault(); });
document.addEventListener('visibilitychange', () => document.body.classList.toggle('oculto', document.hidden && !!S.user));
['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev => window.addEventListener(ev, () => { S.last = Date.now(); }, {passive:true}));
setInterval(() => { if (S.user && Date.now() - S.last > 180000) logout('Se cerró la sesión por 3 minutos sin uso.'); }, 10000);
function leerHash(){
  const m = (location.hash || '').match(/^#(mh-\d{4})$/i); if (!m) return false;
  const id = m[1].toUpperCase();
  if (S.user) consultar(id, 'QR escaneado con la cámara'); else { S.pendiente = id; S.view = 'login'; render(); }
  return true;
}
window.addEventListener('hashchange', leerHash);
if (!leerHash()) render();
</script>
